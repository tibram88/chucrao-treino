<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Hipertrofia — Bloco 1</title>
<style>
  :root{
    --bg:#0b1020; --card:#111827; --muted:#94a3b8; --text:#f8fafc;
    --line:#243044; --input:#172033; --focus:#facc15;
    --blue:#2563eb; --green:#16a34a; --purple:#9333ea; --orange:#ea580c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{padding-bottom:96px}
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#0b1020 82%,rgba(11,16,32,.94));
    padding:12px 12px 10px;border-bottom:1px solid var(--line)
  }
  .topline{display:flex;justify-content:space-between;gap:10px;align-items:center}
  h1{font-size:19px;margin:0}
  .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .save{font-size:12px;color:#86efac}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
  .tab{
    border:0;border-radius:12px;padding:10px 4px;font-weight:800;color:white;
    opacity:.55;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)
  }
  .tab.active{opacity:1;transform:translateY(-1px)}
  .blue{background:var(--blue)} .green{background:var(--green)}
  .purple{background:var(--purple)} .orange{background:var(--orange)}

  main{padding:10px;max-width:760px;margin:0 auto}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .fieldbox,.card,.notes{background:var(--card);border:1px solid var(--line);border-radius:16px}
  .fieldbox{padding:10px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:750}
  input,textarea{
    width:100%;border:1px solid #334155;background:var(--input);color:var(--text);
    border-radius:11px;padding:11px;font-size:18px;outline:none
  }
  input:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 2px rgba(250,204,21,.14)}
  .workout{display:none}.workout.active{display:block}
  .day-title{display:flex;align-items:center;justify-content:space-between;margin:3px 2px 9px;gap:8px}
  .day-title h2{margin:0;font-size:18px}
  .progress{font-size:12px;color:var(--muted);text-align:right}

  .exercise{margin-bottom:10px;overflow:hidden}
  .ex-head{
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;
    padding:13px 13px 9px
  }
  .ex-name{font-size:17px;font-weight:850;line-height:1.18}
  .ex-side{display:flex;gap:8px;align-items:flex-start}
  .target{white-space:nowrap;text-align:right;font-size:12px;color:#cbd5e1;line-height:1.25}
  .order-box{width:58px}
  .order-box label{text-align:center;margin-bottom:3px}
  .order-box input{
    text-align:center;padding:7px 4px;font-size:19px;font-weight:900;border-color:#475569
  }

  .series-wrap{padding:0 10px 10px}
  .series-head,.series-row{
    display:grid;grid-template-columns:44px 1fr 1fr;gap:7px;align-items:center
  }
  .series-head{padding:0 2px 5px}
  .series-head div{font-size:11px;color:var(--muted);font-weight:800;text-align:center}
  .series-row{margin-bottom:7px}
  .series-tag{
    min-height:46px;border-radius:10px;background:#1e293b;border:1px solid #334155;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900
  }
  .series-row input{text-align:center;font-size:20px;font-weight:850;padding:10px 4px;min-height:46px}
  .series-row input::placeholder{font-size:14px;font-weight:700;color:#64748b}

  .obs-wrap{padding:0 11px 11px}
  .obs-toggle{
    width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;
    padding:2px 0 7px;font-size:13px;font-weight:750
  }
  .obs{display:none}.obs.open{display:block}
  .obs input{font-size:15px}

  .notes{padding:11px;margin-top:13px}
  textarea{min-height:72px;font-size:15px;resize:vertical}
  .pain{margin-top:9px}.pain label{color:#fca5a5}

  .hint{
    background:#0f172a;border:1px solid #243044;color:#cbd5e1;border-radius:13px;
    padding:9px 11px;font-size:12px;line-height:1.35;margin-bottom:10px
  }
  .hint b{color:#f8fafc}

  .footer{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(11,16,32,.97);border-top:1px solid var(--line);
    padding:9px 10px calc(9px + env(safe-area-inset-bottom))
  }
  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;max-width:760px;margin:0 auto}
  .btn{border:0;border-radius:12px;padding:11px 5px;font-weight:850;font-size:13px}
  .btn.primary{background:#facc15;color:#111827}
  .btn.secondary{background:#1e293b;color:white}
  .btn.danger{background:#3f1d22;color:#fecaca}

  @media(max-width:390px){
    main{padding:8px}
    header{padding-left:9px;padding-right:9px}
    .tabs{gap:5px}.tab{font-size:12px;padding:9px 2px}
    .ex-name{font-size:16px}
    .ex-side{gap:5px}
    .order-box{width:53px}
    .series-head,.series-row{grid-template-columns:40px 1fr 1fr;gap:6px}
    .series-row input{font-size:19px}
  }
  @media print{
    header,.footer,.obs-toggle,.hint{display:none!important}
    body{background:white;color:black;padding:0}
    main{max-width:none}.workout{display:none!important}.workout.active{display:block!important}
    .card,.fieldbox,.notes{background:white;color:black;border:1px solid #bbb}
    input,textarea,.series-tag{background:white;color:black;border:1px solid #aaa}
    .obs{display:block!important}
  }
</style>
</head>
<body>
<header>
  <div class="topline">
    <div>
      <h1>HIPERTROFIA — BLOCO 1</h1>
      <div class="sub">Semana 1 • registro rápido pelo celular</div>
    </div>
    <div class="save" id="saveStatus">Salvo</div>
  </div>
  <div class="tabs">
    <button class="tab blue active" data-day="seg">SEG</button>
    <button class="tab green" data-day="ter">TER</button>
    <button class="tab purple" data-day="qua">QUA</button>
    <button class="tab orange" data-day="qui">QUI</button>
  </div>
</header>

<main><div id="app"></div></main>

<div class="footer">
  <div class="actions">
    <button class="btn primary" id="exportBtn">Exportar CSV</button>
    <button class="btn secondary" id="printBtn">Imprimir / PDF</button>
    <button class="btn danger" id="clearBtn">Limpar dia</button>
  </div>
</div>

<script>
const workouts = {
  seg:{title:"SEG — Upper A",exercises:[
    ["Supino inclinado 45° na máquina",3,"8–12","2 min"],
    ["Puxada alta na polia",3,"8–12","2 min"],
    ["Voador (Peck Deck)",2,"10–15","90 s"],
    ["Remada em máquina",2,"8–12","90–120 s"],
    ["Elevação lateral com halteres",2,"10–15","60–90 s"],
    ["Tríceps na polia com barra reta",2,"8–12","60–90 s"],
    ["Rosca W",2,"8–12","60–90 s"]]},
  ter:{title:"TER — Lower A",exercises:[
    ["Extensora",3,"10–15","90 s"],
    ["Levantamento terra romeno (stiff)",3,"8–12","2 min"],
    ["Flexora deitada",3,"10–15","90 s"],
    ["Abdução de quadril na máquina",2,"12–15","60–90 s"],
    ["Panturrilha sentado",3,"12–15","60 s"]]},
  qua:{title:"QUA — Upper B",exercises:[
    ["Remada em máquina (puxada baixa)",3,"8–12","2 min"],
    ["Puxada na polia (neutra ou supinada)",2,"8–12","2 min"],
    ["Supino inclinado 45° (com barra ou halter)",3,"8–12","2 min"],
    ["Elevação posterior (inclinado)",2,"10–15","60–90 s"],
    ["Elevação lateral",2,"10–15","60–90 s"],
    ["Rosca martelo na corda",2,"8–12","60–90 s"],
    ["Tríceps overhead na polia (corda)",2,"8–12","60–90 s"]]},
  qui:{title:"QUI — Lower B",exercises:[
    ["Leg press 45° (ou agachamento goblet)",3,"8–12","2 min"],
    ["Flexora deitada",3,"10–15","90 s"],
    ["Extensora",2,"10–15","90 s"],
    ["Levantamento terra romeno (stiff) ou glúteo na máquina",2,"8–12","90–120 s"],
    ["Panturrilha em pé",3,"12–15","60 s"]]}
};

let currentDay = localStorage.getItem("hip_current_day") || "seg";
let data = JSON.parse(localStorage.getItem("hip_data_v1") || "{}");

function dayData(day){
  if(!data[day]) data[day]={date:"",duration:"",general:"",pain:"",ex:{}};
  return data[day];
}
function exData(day,idx){
  const d=dayData(day);
  if(!d.ex[idx]) d.ex[idx]={order:"",w1:"",r1:"",w2:"",r2:"",w3:"",r3:"",obs:""};
  const e=d.ex[idx];

  // Migração automática da versão anterior: uma carga única + S1/S2/S3.
  if(e.load !== undefined || e.s1 !== undefined || e.s2 !== undefined || e.s3 !== undefined){
    if(!e.w1 && e.load) e.w1=e.load;
    if(!e.w2 && e.load) e.w2=e.load;
    if(!e.w3 && e.load) e.w3=e.load;
    if(!e.r1 && e.s1) e.r1=e.s1;
    if(!e.r2 && e.s2) e.r2=e.s2;
    if(!e.r3 && e.s3) e.r3=e.s3;
    delete e.load; delete e.s1; delete e.s2; delete e.s3;
  }
  return e;
}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}

function nextOrder(day){
  const used=[];
  workouts[day].exercises.forEach((_,i)=>{
    const n=parseInt(exData(day,i).order,10);
    if(Number.isFinite(n)) used.push(n);
  });
  for(let n=1;n<=workouts[day].exercises.length;n++) if(!used.includes(n)) return n;
  return used.length+1;
}
function ensureOrder(day,idx){
  const e=exData(day,idx);
  if(!String(e.order).trim()) e.order=String(nextOrder(day));
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  Object.entries(workouts).forEach(([day,w])=>{
    const d=dayData(day);
    const section=document.createElement("section");
    section.className="workout"+(day===currentDay?" active":"");
    section.dataset.day=day;

    const completed=w.exercises.filter((_,i)=>{
      const e=exData(day,i);
      return e.r1||e.r2||e.r3||e.w1||e.w2||e.w3;
    }).length;

    section.innerHTML=`
      <div class="day-title">
        <h2>${w.title}</h2>
        <div class="progress">${completed}/${w.exercises.length} registrados</div>
      </div>
      <div class="hint"><b>Ordem automática:</b> ao preencher a primeira série de um exercício, ele recebe o próximo número disponível. Você pode alterar o número manualmente.</div>
      <div class="meta">
        <div class="fieldbox"><label>Data</label><input type="date" data-bind="date" value="${esc(d.date)}"></div>
        <div class="fieldbox"><label>Duração total</label><input type="text" inputmode="numeric" placeholder="38 min" data-bind="duration" value="${esc(d.duration)}"></div>
      </div>`;

    w.exercises.forEach((ex,i)=>{
      const [name,series,reps,rest]=ex;
      const e=exData(day,i);
      const card=document.createElement("div");
      card.className="card exercise";
      let seriesRows="";
      for(let s=1;s<=series;s++){
        seriesRows += `
          <div class="series-row">
            <div class="series-tag">S${s}</div>
            <input inputmode="decimal" placeholder="peso" data-ex="${i}" data-field="w${s}" value="${esc(e["w"+s])}">
            <input inputmode="numeric" placeholder="reps" data-ex="${i}" data-field="r${s}" value="${esc(e["r"+s])}">
          </div>`;
      }
      card.innerHTML=`
        <div class="ex-head">
          <div class="ex-name">${i+1}. ${name}</div>
          <div class="ex-side">
            <div class="target"><b>${reps}</b><br>${rest}</div>
            <div class="order-box">
              <label>Ordem</label>
              <input inputmode="numeric" data-ex="${i}" data-field="order" value="${esc(e.order)}">
            </div>
          </div>
        </div>
        <div class="series-wrap">
          <div class="series-head"><div></div><div>PESO</div><div>REPS</div></div>
          ${seriesRows}
        </div>
        <div class="obs-wrap">
          <button class="obs-toggle" type="button">+ observação opcional</button>
          <div class="obs ${e.obs?"open":""}">
            <input type="text" placeholder="dor, falha, carga leve..." data-ex="${i}" data-field="obs" value="${esc(e.obs)}">
          </div>
        </div>`;
      section.appendChild(card);
    });

    const notes=document.createElement("div");
    notes.className="notes";
    notes.innerHTML=`
      <label>Observações gerais</label>
      <textarea data-bind="general" placeholder="Só se houver algo relevante...">${d.general||""}</textarea>
      <div class="pain"><label>Dor / desconforto</label>
      <textarea data-bind="pain" placeholder="Local e intensidade, se houver...">${d.pain||""}</textarea></div>`;
    section.appendChild(notes);
    app.appendChild(section);
  });
  bindInputs(); updateTabs();
}

function bindInputs(){
  document.querySelectorAll(".workout").forEach(section=>{
    const day=section.dataset.day;
    section.querySelectorAll("[data-bind]").forEach(el=>{
      el.addEventListener("input",()=>{dayData(day)[el.dataset.bind]=el.value;save();});
    });
    section.querySelectorAll("[data-ex]").forEach(el=>{
      el.addEventListener("input",()=>{
        const idx=Number(el.dataset.ex), field=el.dataset.field;
        const e=exData(day,idx);
        e[field]=el.value;

        // Se começou a registrar peso/reps e ainda não há ordem, marca automaticamente.
        if(/^w[123]$|^r[123]$/.test(field) && el.value.trim() && !String(e.order).trim()){
          ensureOrder(day,idx);
          const orderInput=section.querySelector(`[data-ex="${idx}"][data-field="order"]`);
          if(orderInput) orderInput.value=e.order;
        }
        save();
      });
    });
    section.querySelectorAll(".obs-toggle").forEach(btn=>{
      btn.addEventListener("click",()=>btn.nextElementSibling.classList.toggle("open"));
    });
  });
}

let saveTimer;
function save(){
  document.getElementById("saveStatus").textContent="Salvando…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    localStorage.setItem("hip_data_v1",JSON.stringify(data));
    localStorage.setItem("hip_current_day",currentDay);
    document.getElementById("saveStatus").textContent="Salvo";
  },120);
}

function updateTabs(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.day===currentDay));
}
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    currentDay=tab.dataset.day;
    localStorage.setItem("hip_current_day",currentDay);
    document.querySelectorAll(".workout").forEach(s=>s.classList.toggle("active",s.dataset.day===currentDay));
    updateTabs(); window.scrollTo({top:0,behavior:"smooth"});
  });
});

document.getElementById("clearBtn").addEventListener("click",()=>{
  if(confirm("Limpar todos os registros deste treino?")){
    data[currentDay]={date:"",duration:"",general:"",pain:"",ex:{}};
    save(); render();
  }
});
document.getElementById("printBtn").addEventListener("click",()=>window.print());

document.getElementById("exportBtn").addEventListener("click",()=>{
  const w=workouts[currentDay],d=dayData(currentDay);
  const rows=[["Treino",w.title],["Data",d.date],["Duração",d.duration],[],
    ["Ordem","Exercício","Meta","Descanso","S1 Peso","S1 Reps","S2 Peso","S2 Reps","S3 Peso","S3 Reps","Observação"]];
  w.exercises.forEach((ex,i)=>{
    const e=exData(currentDay,i);
    rows.push([e.order,ex[0],ex[2],ex[3],e.w1,e.r1,e.w2,e.r2,ex[1]===3?e.w3:"",ex[1]===3?e.r3:"",e.obs]);
  });
  rows.push([],["Observações gerais",d.general],["Dor / desconforto",d.pain]);
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`${w.title.replace(/[^\wÀ-ÿ-]+/g,"_")}.csv`;a.click();
  URL.revokeObjectURL(url);
});

render();
save();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>CHUCRÃO — Treino</title>
<style>
:root{--bg:#080b12;--card:#111722;--card2:#151d2a;--line:#273244;--text:#f8fafc;--muted:#94a3b8;--gold:#e59a16;
--blue:#2563eb;--green:#16a34a;--purple:#9333ea;--orange:#ea580c;}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{padding-bottom:102px} header{position:sticky;top:0;z-index:30;background:rgba(8,11,18,.97);border-bottom:1px solid #222b38;padding:8px 10px 9px}
.brand{display:flex;align-items:center;gap:10px} .avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.brandtext{min-width:0;flex:1} h1{font-size:19px;margin:0;letter-spacing:.5px} .tag{font-size:11px;color:#d8a541;margin-top:1px} .save{font-size:11px;color:#86efac}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px} .tab{border:0;border-radius:11px;padding:9px 2px;font-weight:900;color:white;opacity:.5}
.tab.active{opacity:1} .blue{background:var(--blue)}.green{background:var(--green)}.purple{background:var(--purple)}.orange{background:var(--orange)}
main{padding:9px;max-width:760px;margin:auto} .workout{display:none}.workout.active{display:block}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px} .timerbtn{border:1px solid #39465a;border-radius:13px;padding:11px 8px;font-weight:900;font-size:14px}
.start{background:#16311f;color:#a7f3d0} .finish{background:#3a2020;color:#fecaca} .finish:disabled{opacity:.4}
.status{grid-column:1/-1;background:#101722;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:#cbd5e1;text-align:center}
.daytitle{display:flex;justify-content:space-between;align-items:end;margin:5px 2px 9px} .daytitle h2{margin:0;font-size:18px} .progress{font-size:11px;color:var(--muted)}
.card,.notes{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.exhead{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 12px 7px} .exname{font-size:16px;font-weight:900;line-height:1.18}
.right{display:flex;gap:6px;align-items:start} .target{font-size:11px;color:#cbd5e1;text-align:right;white-space:nowrap}
.order{width:48px} label{display:block;font-size:10px;color:var(--muted);font-weight:800;text-align:center;margin-bottom:3px}
input,textarea{width:100%;background:#182131;color:white;border:1px solid #344155;border-radius:10px;outline:none}
.order input{padding:6px 2px;text-align:center;font-size:17px;font-weight:900}
.series{padding:0 9px 9px} .shead,.srow{display:grid;grid-template-columns:39px 1fr 1fr;gap:6px;align-items:center}
.shead div{font-size:10px;color:var(--muted);font-weight:800;text-align:center;padding-bottom:4px} .srow{margin-bottom:6px}
.stag{height:44px;background:#202b3b;border:1px solid #344155;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900}
.srow input{height:44px;padding:7px 3px;text-align:center;font-size:19px;font-weight:900}
.minirow{display:flex;justify-content:space-between;gap:8px;padding:0 11px 10px;align-items:center}
.historybtn,.obsbtn{border:0;background:transparent;padding:4px 0;color:#d8a541;font-size:12px;font-weight:850} .obsbtn{color:#cbd5e1}
.obs{display:none;padding:0 11px 10px}.obs.open{display:block} .obs input{padding:10px;font-size:14px}
.pop{display:none;margin:0 10px 10px;background:#0b111b;border:1px solid #7b5a1d;border-radius:12px;padding:9px}.pop.open{display:block}
.pophead{font-size:12px;font-weight:900;color:#f0b84b;margin-bottom:6px} .histitem{font-size:12px;line-height:1.45;padding:6px 0;border-top:1px solid #273244}
.histitem:first-of-type{border-top:0} .empty{font-size:12px;color:var(--muted)}
.notes{padding:10px} .notes label{text-align:left;font-size:11px} textarea{min-height:62px;padding:9px;font-size:14px;resize:vertical;margin-bottom:8px}
.footer{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(8,11,18,.98);border-top:1px solid #273244;padding:8px 9px calc(8px + env(safe-area-inset-bottom))}
.actions{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px} .btn{border:0;border-radius:11px;padding:10px 4px;font-weight:900;font-size:12px}
.pdf{background:#1f2937;color:white} .backup{background:#4a3511;color:#fde68a} .clear{background:#3a2020;color:#fecaca}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px} .modal.open{display:flex}
.modalbox{width:min(430px,100%);background:#111722;border:1px solid #7b5a1d;border-radius:18px;padding:16px;text-align:center}
.modalbox h3{margin:0 0 6px;color:#f0b84b} .modalbox p{margin:5px 0;color:#cbd5e1;font-size:14px} .modalbox button{margin-top:12px;border:0;border-radius:10px;padding:10px 18px;background:var(--gold);font-weight:900}
@media print{header,.footer,.toolbar,.historybtn,.obsbtn,.pop{display:none!important}body{background:white;color:black;padding:0}main{max-width:none}.workout{display:none!important}.workout.active{display:block!important}
.card,.notes{background:white;color:black;border:1px solid #aaa}input,textarea,.stag{background:white;color:black;border:1px solid #aaa}}
</style></head>

<main><div id="app"></div></main>
<div class="footer"><div class="actions"><button class="btn pdf" id="printBtn">Imprimir / PDF</button><button class="btn backup" id="backupBtn">Backup</button><button class="btn clear" id="clearBtn">Limpar atual</button></div></div>
<div class="modal" id="doneModal"><div class="modalbox"><h3>Treino salvo 💪</h3><p id="doneText"></p><button onclick="document.getElementById('doneModal').classList.remove('open')">Fechar</button></div></div>
<script>
const workouts={
seg:{title:"SEG — Upper A",exercises:[["Supino inclinado 45° na máquina",3,"8–12","2 min"],["Puxada alta na polia",3,"8–12","2 min"],["Voador (Peck Deck)",2,"10–15","90 s"],["Remada em máquina",2,"8–12","90–120 s"],["Elevação lateral com halteres",2,"10–15","60–90 s"],["Tríceps na polia com barra reta",2,"8–12","60–90 s"],["Rosca W",2,"8–12","60–90 s"]]},
ter:{title:"TER — Lower A",exercises:[["Extensora",3,"10–15","90 s"],["Levantamento terra romeno (stiff)",3,"8–12","2 min"],["Flexora deitada",3,"10–15","90 s"],["Abdução de quadril na máquina",2,"12–15","60–90 s"],["Panturrilha sentado",3,"12–15","60 s"]]},
qua:{title:"QUA — Upper B",exercises:[["Remada em máquina (puxada baixa)",3,"8–12","2 min"],["Puxada na polia (neutra ou supinada)",2,"8–12","2 min"],["Supino inclinado 45° (com barra ou halter)",3,"8–12","2 min"],["Elevação posterior (inclinado)",2,"10–15","60–90 s"],["Elevação lateral",2,"10–15","60–90 s"],["Rosca martelo na corda",2,"8–12","60–90 s"],["Tríceps overhead na polia (corda)",2,"8–12","60–90 s"]]},
qui:{title:"QUI — Lower B",exercises:[["Leg press 45° (ou agachamento goblet)",3,"8–12","2 min"],["Flexora deitada",3,"10–15","90 s"],["Extensora",2,"10–15","90 s"],["Levantamento terra romeno (stiff) ou glúteo na máquina",2,"8–12","90–120 s"],["Panturrilha em pé",3,"12–15","60 s"]]}
};
let currentDay=localStorage.getItem("ch_current_day")||"seg";
let current=JSON.parse(localStorage.getItem("ch_current_v3")||"{}");
let history=JSON.parse(localStorage.getItem("ch_history_v3")||"[]");

function dayData(day){if(!current[day])current[day]={start:null,general:"",pain:"",ex:{}};return current[day]}
function exData(day,i){let d=dayData(day);if(!d.ex[i])d.ex[i]={order:"",w1:"",r1:"",w2:"",r2:"",w3:"",r3:"",obs:""};return d.ex[i]}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function save(){localStorage.setItem("ch_current_v3",JSON.stringify(current));localStorage.setItem("ch_history_v3",JSON.stringify(history));localStorage.setItem("ch_current_day",currentDay);document.getElementById("saveStatus").textContent="Salvo"}
function nextOrder(day){let u=[];workouts[day].exercises.forEach((_,i)=>{let n=parseInt(exData(day,i).order);if(n)u.push(n)});for(let n=1;n<=workouts[day].exercises.length;n++)if(!u.includes(n))return n;return u.length+1}
function duration(ms){let m=Math.max(0,Math.round(ms/60000));let h=Math.floor(m/60),r=m%60;return h?`${h}h ${r}min`:`${m} min`}
function fmtDate(iso){return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"})}
function getHist(day,i){return history.filter(s=>s.day===day).sort((a,b)=>new Date(b.end)-new Date(a.end)).slice(0,3).map(s=>({date:s.end,e:s.ex[i]})).filter(x=>x.e)}
function histLine(h,series){let a=[];for(let s=1;s<=series;s++){let w=h.e["w"+s],r=h.e["r"+s];if(w||r)a.push(`${w||"?"} kg × ${r||"?"}`)}return a.join(" | ")||"sem registro"}

function render(){
let app=document.getElementById("app");app.innerHTML="";
Object.entries(workouts).forEach(([day,w])=>{let d=dayData(day),sec=document.createElement("section");sec.className="workout"+(day===currentDay?" active":"");sec.dataset.day=day;
let comp=w.exercises.filter((_,i)=>{let e=exData(day,i);return e.r1||e.r2||e.r3}).length;
sec.innerHTML=`<div class="daytitle"><h2>${w.title}</h2><div class="progress">${comp}/${w.exercises.length} registrados</div></div>
<div class="toolbar"><button class="timerbtn start" data-action="start">${d.start?"▶ Reiniciar início":"▶ Iniciar treino"}</button><button class="timerbtn finish" data-action="finish" ${!d.start?"disabled":""}>■ Finalizar e salvar</button>
<div class="status">${d.start?`Iniciado às ${new Date(d.start).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} • duração calculada ao finalizar`:"Toque em Iniciar quando começar o treino."}</div></div>`;
w.exercises.forEach((ex,i)=>{let [name,series,reps,rest]=ex,e=exData(day,i),card=document.createElement("div");card.className="card";
let rows="";for(let s=1;s<=series;s++)rows+=`<div class="srow"><div class="stag">S${s}</div><input inputmode="decimal" placeholder="peso" data-ex="${i}" data-field="w${s}" value="${esc(e["w"+s])}"><input inputmode="numeric" placeholder="reps" data-ex="${i}" data-field="r${s}" value="${esc(e["r"+s])}"></div>`;
let hs=getHist(day,i),hist=hs.length?hs.map(h=>`<div class="histitem"><b>${fmtDate(h.date)}</b> — ${histLine(h,series)}</div>`).join(""):`<div class="empty">Ainda não há treinos anteriores salvos.</div>`;
card.innerHTML=`<div class="exhead"><div class="exname">${i+1}. ${name}</div><div class="right"><div class="target"><b>${reps}</b><br>${rest}</div><div class="order"><label>ORDEM</label><input inputmode="numeric" data-ex="${i}" data-field="order" value="${esc(e.order)}"></div></div></div>
<div class="series"><div class="shead"><div></div><div>PESO</div><div>REPS</div></div>${rows}</div>
<div class="minirow"><button class="historybtn" type="button">↺ Últimos 3</button><button class="obsbtn" type="button">+ observação</button></div>
<div class="pop"><div class="pophead">Últimos registros neste treino</div>${hist}</div><div class="obs ${e.obs?"open":""}"><input placeholder="dor, falha, carga leve..." data-ex="${i}" data-field="obs" value="${esc(e.obs)}"></div>`;
sec.appendChild(card)});
let notes=document.createElement("div");notes.className="notes";notes.innerHTML=`<label>OBSERVAÇÕES GERAIS</label><textarea data-bind="general">${d.general||""}</textarea><label style="color:#fca5a5">DOR / DESCONFORTO</label><textarea data-bind="pain">${d.pain||""}</textarea>`;sec.appendChild(notes);app.appendChild(sec)});bind();tabs()}

function bind(){
document.querySelectorAll(".workout").forEach(sec=>{let day=sec.dataset.day;
sec.querySelector('[data-action="start"]').onclick=()=>{let d=dayData(day);if(d.start&&!confirm("Reiniciar o horário de início deste treino?"))return;d.start=new Date().toISOString();save();render()};
sec.querySelector('[data-action="finish"]').onclick=()=>finish(day);
sec.querySelectorAll("[data-bind]").forEach(el=>el.oninput=()=>{dayData(day)[el.dataset.bind]=el.value;save()});
sec.querySelectorAll("[data-ex]").forEach(el=>el.oninput=()=>{let i=+el.dataset.ex,e=exData(day,i),f=el.dataset.field;e[f]=el.value;if((f.startsWith("w")||f.startsWith("r"))&&el.value&&!e.order){e.order=String(nextOrder(day));let o=sec.querySelector(`[data-ex="${i}"][data-field="order"]`);if(o)o.value=e.order}save()});
sec.querySelectorAll(".historybtn").forEach(b=>b.onclick=()=>b.parentElement.nextElementSibling.classList.toggle("open"));
sec.querySelectorAll(".obsbtn").forEach(b=>b.onclick=()=>b.parentElement.nextElementSibling.nextElementSibling.classList.toggle("open"));
})}
function finish(day){let d=dayData(day);if(!d.start)return;if(!confirm("Finalizar o treino e gravar esta sessão no histórico?"))return;let end=new Date().toISOString();
let snap={day,title:workouts[day].title,start:d.start,end,durationMs:new Date(end)-new Date(d.start),general:d.general,pain:d.pain,ex:JSON.parse(JSON.stringify(d.ex))};history.push(snap);current[day]={start:null,general:"",pain:"",ex:{}};save();
document.getElementById("doneText").textContent=`${workouts[day].title} • ${new Date(end).toLocaleDateString("pt-BR")} • ${duration(snap.durationMs)}`;document.getElementById("doneModal").classList.add("open");render()}
function tabs(){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.day===currentDay))}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{currentDay=t.dataset.day;save();document.querySelectorAll(".workout").forEach(s=>s.classList.toggle("active",s.dataset.day===currentDay));tabs();scrollTo(0,0)})
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("clearBtn").onclick=()=>{if(confirm("Limpar somente o treino atual? O histórico salvo não será apagado.")){current[currentDay]={start:null,general:"",pain:"",ex:{}};save();render()}};
